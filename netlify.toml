# Despliegue de la web de SARHA (landing-v3) en Netlify.
# Guía paso a paso: landing-v3/DESPLIEGUE-NETLIFY.md
[build]
  base = "landing-v3"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Las imágenes y los cuadros del zoom no cambian entre despliegues con el mismo nombre de archivo
[[headers]]
  for = "/sarha/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
