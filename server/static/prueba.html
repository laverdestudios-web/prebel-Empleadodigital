<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas Empleado Digital</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --line: #e2dfd8; --user: #dff3e4; --bot: #ffffff; --accent: #1f6f4a;
    --accent-text: #ffffff; --err: #b3261e; --chip: #ecebe6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141513; --panel: #1d1f1c; --text: #ecebe6; --muted: #a3a29c;
      --line: #2e302c; --user: #1f3b2b; --bot: #252723; --accent: #5cc18f;
      --accent-text: #0d1a12; --err: #f2b8b5; --chip: #2a2c28;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  header .meta { color: var(--muted); font-size: 12px; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
         white-space: normal; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; background: var(--bot); }
  .msg.err { align-self: flex-start; color: var(--err); border-color: var(--err); }
  .msg .t { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .msg a { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .chips button { background: var(--chip); border-color: transparent; font-size: 13px; padding: 5px 10px; }
  form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-height: 42px; max-height: 140px;
  }
  form button[type=submit] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  form button:disabled { opacity: .55; cursor: wait; }
  .typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Empleado Digital Prebel · modo pruebas</h1>
    <span class="meta" id="meta">sin consultas</span>
    <button type="button" id="reset" title="Borra el historial de esta conversación">Nueva conversación</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="f">
    <textarea id="q" placeholder="Escribe como lo haría un colaborador..." maxlength="1000" rows="1"></textarea>
    <button type="submit" id="send">Enviar</button>
  </form>
</div>
<script>
const SUGERENCIAS = [
  "¿Cuánto es el auxilio de matrimonio?",
  "¿Me prestan plata para una moto?",
  "Auxilio de gafas, ¿cuánto dan?",
  "¿Puedo afiliar a mi mamá a la caja?",
  "¿Cuántos días de vacaciones tengo?",
  "¿Qué es un Business Partner?",
  "Requisitos crédito de vivienda",
  "¿Cuál es el salario del gerente?"
];
const log = document.getElementById("log"), q = document.getElementById("q"),
      send = document.getElementById("send"), meta = document.getElementById("meta");
let sesion = nuevaSesion();

function nuevaSesion() { return "s" + Math.random().toString(36).slice(2, 12); }

function escapar(t) {
  return t.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Formato tipo WhatsApp: **negrita** / *negrita*, enlaces y saltos de línea.
function formatear(t) {
  let h = escapar(t);
  h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|\s)\*(\S[^*]*?)\*/g, "$1<strong>$2</strong>");
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  return h.replace(/\n/g, "<br>");
}
function agregar(clase, html) {
  const d = document.createElement("div");
  d.className = "msg " + clase; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

async function preguntar(texto) {
  texto = texto.trim(); if (!texto) return;
  agregar("user", formatear(texto));
  q.value = ""; send.disabled = true;
  const espera = agregar("bot typing", "escribiendo...");
  try {
    const r = await fetch("prueba/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({mensaje: texto, sesion})
    });
    const d = await r.json().catch(() => ({}));
    espera.remove();
    if (!r.ok) {
      const det = typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail || d);
      agregar("err", "Error " + r.status + ": " + escapar(det || "sin detalle"));
    } else {
      agregar("bot", formatear(d.respuesta) + '<span class="t">' + d.segundos + " s · " + escapar(d.modelo) + "</span>");
      meta.textContent = "último: " + d.segundos + " s";
    }
  } catch (e) {
    espera.remove(); agregar("err", "No hay conexión con el servidor: " + escapar(String(e)));
  } finally { send.disabled = false; q.focus(); }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); preguntar(q.value); });
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!send.disabled) preguntar(q.value); }
});
document.getElementById("reset").addEventListener("click", async () => {
  await fetch("prueba/reiniciar", {method: "POST", headers: {"Content-Type": "application/json"},
                                    body: JSON.stringify({sesion})}).catch(() => {});
  sesion = nuevaSesion(); log.innerHTML = ""; meta.textContent = "sin consultas";
});
const chips = document.getElementById("chips");
SUGERENCIAS.forEach(s => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = s;
  b.onclick = () => { if (!send.disabled) preguntar(s); }; chips.appendChild(b);
});
q.focus();
</script>
</body>
</html>
